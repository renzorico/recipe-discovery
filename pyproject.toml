[project]
name = "recipe-discovery"
version = "0.1.0"
description = "Semantic recipe discovery over a 30k-recipe catalogue"
requires-python = ">=3.13"

dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "ruff>=0.16.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
